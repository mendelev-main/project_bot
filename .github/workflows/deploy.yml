name: Deploy Bot to VDS

on:
  push:
    branches:
      - main

concurrency:
  group: production-bot-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VDS_SSH_KEY }}
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_PORT: ${{ secrets.VDS_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VDS_PORT" -H "$VDS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy and verify bot
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_PORT: ${{ secrets.VDS_PORT }}
          VDS_USER: ${{ secrets.VDS_USER }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$VDS_PORT" \
            -o IdentitiesOnly=yes \
            "$VDS_USER@$VDS_HOST" \
            'sudo -n /opt/mpos/scripts/deploy-bot.sh'

      - name: Verify deployed commit
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_PORT: ${{ secrets.VDS_PORT }}
          VDS_USER: ${{ secrets.VDS_USER }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          ACTUAL_SHA="$(ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$VDS_PORT" \
            -o IdentitiesOnly=yes \
            "$VDS_USER@$VDS_HOST" \
            'git -C /opt/mpos/bot rev-parse HEAD')"

          echo "Expected commit: $EXPECTED_SHA"
          echo "Deployed commit: $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "Commit verification: OK"

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "## Bot production deployment successful"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Environment: production"
            echo "- VDS deploy: OK"
            echo "- Commit verification: OK"
            echo "- Bot stability check (30s): OK"
            echo "- Restart loop check: OK"
          } >> "$GITHUB_STEP_SUMMARY"
