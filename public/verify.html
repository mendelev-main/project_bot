<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Проект — подтверждение номера</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--tg-theme-bg-color, #0f1115);
      color: var(--tg-theme-text-color, #ffffff);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card { width: min(100%, 420px); text-align: center; }
    .mark {
      width: 68px; height: 68px; margin: 0 auto 24px;
      border-radius: 22px; display: grid; place-items: center;
      background: var(--tg-theme-button-color, #2aabee);
      color: var(--tg-theme-button-text-color, #fff);
      font-size: 30px; font-weight: 700;
    }
    h1 { margin: 0 0 12px; font-size: 26px; letter-spacing: -.4px; }
    p {
      margin: 0 auto 28px;
      max-width: 340px;
      color: var(--tg-theme-hint-color, #9aa0aa);
      line-height: 1.45;
      font-size: 16px;
    }
    button {
      width: 100%; border: 0; border-radius: 14px; padding: 15px 18px;
      background: var(--tg-theme-button-color, #2aabee);
      color: var(--tg-theme-button-text-color, #fff);
      font-size: 16px; font-weight: 650; cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: default; }
    .status { min-height: 22px; margin-top: 16px; font-size: 14px; color: var(--tg-theme-hint-color, #9aa0aa); }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">P</div>
    <h1>Подтвердите номер</h1>
    <p>Telegram попросит разрешение передать номер телефона, привязанный к вашему аккаунту.</p>
    <button id="verify">Подтвердить номер</button>
    <div class="status" id="status"></div>
  </main>

  <script>
    const tg = window.Telegram?.WebApp;
    const button = document.getElementById('verify');
    const status = document.getElementById('status');

    if (!tg) {
      button.disabled = true;
      status.textContent = 'Откройте эту страницу из Telegram.';
    } else {
      tg.ready();
      tg.expand();

      button.addEventListener('click', () => {
        button.disabled = true;
        status.textContent = '';

        if (typeof tg.requestContact !== 'function') {
          status.textContent = 'Обновите Telegram и попробуйте снова.';
          button.disabled = false;
          return;
        }

        tg.requestContact((shared) => {
          if (shared) {
            status.textContent = 'Номер передан. Возвращаемся в чат…';
            setTimeout(() => tg.close(), 700);
          } else {
            status.textContent = 'Подтверждение отменено.';
            button.disabled = false;
          }
        });
      });
    }
  </script>
</body>
</html>
